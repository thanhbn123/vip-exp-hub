<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đối soát COD — VIP Express Hub</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div id="noi-dung-trang">
  <div class="luoi luoi-kpi" id="kpi-cod">
    <div class="the dang-tai" style="grid-column:1/-1"><span class="xoay"></span>Đang tải…</div>
  </div>
  <div class="hang-cong-cu" style="margin-top:16px">
    <select id="loc-hang" class="nut" style="padding:7px 10px" aria-label="Lọc theo hãng"><option value="">Tất cả hãng</option></select>
    <select id="loc-ds" class="nut" style="padding:7px 10px" aria-label="Lọc theo trạng thái đối soát">
      <option value="">Mọi trạng thái đối soát</option>
      <option value="da">Đã đối soát (demo)</option>
      <option value="chua">Chưa đối soát</option>
    </select>
    <div class="day"><button class="nut nut-chinh" id="nut-doi-soat">🧾 Chạy đối soát (DEMO)</button></div>
  </div>
  <div class="the">
    <div class="the-dau"><h2>COD theo vận đơn (đơn giao thành công, mô phỏng)</h2>
      <div class="phai"><span class="tag-demo">DEMO</span></div></div>
    <div class="cuon-ngang"><table class="bang">
      <thead><tr><th>Mã vận đơn</th><th>Hãng</th><th class="so-tien">COD phải thu</th><th class="so-tien">Đã nhận (demo)</th>
        <th class="so-tien">Phí hãng</th><th class="so-tien">Chênh lệch</th><th>Đối soát</th></tr></thead>
      <tbody id="bang-cod"></tbody>
    </table></div>
  </div>
</div>
<script src="../assets/js/app.js"></script>
<script src="cod.js"></script>
</body>
</html>
