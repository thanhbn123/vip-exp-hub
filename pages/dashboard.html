<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — VIP Express Hub</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div id="noi-dung-trang">
  <div class="hang-cong-cu">
    <label for="loc-ngay" style="font-weight:600">Khoảng thời gian:</label>
    <select id="loc-ngay" class="nut" style="padding:7px 10px">
      <option value="7">7 ngày qua</option>
      <option value="14">14 ngày qua</option>
      <option value="30" selected>30 ngày qua</option>
    </select>
    <label for="loc-hang-db" style="font-weight:600">Hãng:</label>
    <select id="loc-hang-db" class="nut" style="padding:7px 10px"><option value="">Tất cả hãng</option></select>
    <div class="day"><span class="tag-demo">DEMO — CHƯA KẾT NỐI API</span></div>
  </div>

  <div class="luoi luoi-kpi" id="khay-kpi">
    <div class="the dang-tai" style="grid-column:1/-1"><span class="xoay"></span>Đang tải dữ liệu mô phỏng…</div>
  </div>

  <div class="luoi luoi-2" style="margin-top:16px">
    <div class="the">
      <div class="the-dau"><h2>Đơn tạo theo ngày</h2><div class="phai"><span class="tag-demo">DEMO</span></div></div>
      <div class="the-than">
        <canvas id="bd-duong" class="bieu-do" style="height:260px" role="img" aria-label="Biểu đồ đường số đơn tạo theo ngày (dữ liệu mô phỏng)"></canvas>
      </div>
    </div>
    <div class="the">
      <div class="the-dau"><h2>Trạng thái vận đơn</h2><div class="phai"><span class="tag-demo">DEMO</span></div></div>
      <div class="the-than">
        <canvas id="bd-tron" class="bieu-do" style="height:220px" role="img" aria-label="Biểu đồ tròn phân bố trạng thái (dữ liệu mô phỏng)"></canvas>
        <div class="chu-giai" id="cg-tron"></div>
      </div>
    </div>
  </div>

  <div class="luoi luoi-2" style="margin-top:16px">
    <div class="the">
      <div class="the-dau"><h2>Giao thành công / thất bại theo hãng</h2><div class="phai"><span class="tag-demo">DEMO</span></div></div>
      <div class="the-than">
        <canvas id="bd-cot" class="bieu-do" style="height:260px" role="img" aria-label="Biểu đồ cột giao thành công và thất bại theo hãng (dữ liệu mô phỏng)"></canvas>
        <div class="chu-giai">
          <span><span class="cham" style="background:#15803D"></span>Giao thành công</span>
          <span><span class="cham" style="background:#CC0000"></span>Giao thất bại</span>
        </div>
      </div>
    </div>
    <div class="the">
      <div class="the-dau"><h2>Vận đơn mới nhất</h2>
        <div class="phai"><a class="nut nut-nho" href="shipments.html">Xem tất cả</a></div></div>
      <div class="cuon-ngang">
        <table class="bang">
          <thead><tr><th>Mã vận đơn</th><th>Hãng</th><th>Trạng thái</th><th class="so-tien">COD</th></tr></thead>
          <tbody id="bang-moi-nhat"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="../assets/js/app.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
