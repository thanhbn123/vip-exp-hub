<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo cáo — VIP Express Hub</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div id="noi-dung-trang">
  <div class="hang-cong-cu">
    <label for="loc-ngay" style="font-weight:600">Khoảng thời gian:</label>
    <select id="loc-ngay" class="nut" style="padding:7px 10px">
      <option value="7">7 ngày qua</option>
      <option value="14">14 ngày qua</option>
      <option value="30" selected>30 ngày qua</option>
    </select>
    <div class="day"><span class="tag-demo">DEMO — số liệu mô phỏng</span></div>
  </div>

  <div class="the">
    <div class="the-dau"><h2>Sản lượng theo hãng</h2></div>
    <div class="the-than">
      <canvas id="bd-hang" class="bieu-do" style="height:280px" role="img" aria-label="Biểu đồ cột sản lượng theo hãng (mô phỏng)"></canvas>
      <div class="chu-giai">
        <span><span class="cham" style="background:#1D4ED8"></span>Tổng đơn</span>
        <span><span class="cham" style="background:#15803D"></span>Giao thành công</span>
        <span><span class="cham" style="background:#CC0000"></span>Giao thất bại</span>
      </div>
    </div>
  </div>

  <div class="luoi luoi-2" style="margin-top:16px">
    <div class="the">
      <div class="the-dau"><h2>COD theo hãng (demo)</h2></div>
      <div class="the-than">
        <canvas id="bd-cod" class="bieu-do" style="height:240px" role="img" aria-label="Biểu đồ cột COD theo hãng (mô phỏng)"></canvas>
      </div>
    </div>
    <div class="the">
      <div class="the-dau"><h2>Bảng tổng hợp theo hãng</h2></div>
      <div class="cuon-ngang"><table class="bang">
        <thead><tr><th>Hãng</th><th class="so-tien">Đơn</th><th class="so-tien">Thành công</th><th class="so-tien">Tỷ lệ</th><th class="so-tien">COD (demo)</th></tr></thead>
        <tbody id="bang-tong"></tbody>
      </table></div>
    </div>
  </div>
</div>
<script src="../assets/js/app.js"></script>
<script src="reports.js"></script>
</body>
</html>
