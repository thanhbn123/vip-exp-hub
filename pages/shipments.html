<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vận đơn — VIP Express Hub</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div id="noi-dung-trang">
  <div class="hang-cong-cu">
    <input id="tim" type="search" placeholder="Tìm mã đơn, mã vận đơn, người nhận, SĐT…" aria-label="Tìm kiếm vận đơn"
      style="padding:8px 12px;border:1px solid var(--vien);border-radius:8px;font-size:13px;min-width:260px">
    <select id="loc-hang" class="nut" style="padding:7px 10px" aria-label="Lọc theo hãng"><option value="">Tất cả hãng</option></select>
    <select id="loc-tt" class="nut" style="padding:7px 10px" aria-label="Lọc theo trạng thái"><option value="">Mọi trạng thái</option></select>
    <div class="day">
      <a class="nut nut-chinh" href="create-order.html">➕ Tạo đơn</a>
    </div>
  </div>
  <div class="the">
    <div class="the-dau"><h2>Danh sách vận đơn đa hãng</h2>
      <div class="phai"><span class="tag-demo">DEMO</span><span id="dem" style="font-size:12.5px;color:var(--chu-mo)"></span></div></div>
    <div class="cuon-ngang"><table class="bang">
      <thead><tr><th>Mã đơn</th><th>Mã vận đơn</th><th>Hãng</th><th>Người nhận</th><th>Địa chỉ</th>
        <th class="so-tien">COD</th><th class="so-tien">Cước</th><th>Trạng thái</th><th>Ngày tạo</th><th></th></tr></thead>
      <tbody id="bang"><tr><td colspan="10"><div class="dang-tai"><span class="xoay"></span>Đang tải…</div></td></tr></tbody>
    </table></div>
    <div class="phan-trang" id="pt"></div>
  </div>
</div>
<script src="../assets/js/app.js"></script>
<script src="shipments.js"></script>
</body>
</html>
