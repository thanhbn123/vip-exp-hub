<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webhook Center — VIP Express Hub</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div id="noi-dung-trang">
  <div class="hop-loi" style="background:var(--xanh-duong-nhat);border-color:#BFDBFE;color:var(--xanh-duong);margin-bottom:16px">
    ℹ️ G00 chỉ hiển thị <b>sự kiện mô phỏng</b>. Chưa mở endpoint công khai nào; callback Viettel Post hiện tại không bị đụng tới. Payload bên dưới đã che thông tin cá nhân.
  </div>
  <div class="luoi luoi-kpi" id="kpi-wh"></div>

  <div class="hang-cong-cu" style="margin-top:16px">
    <label for="nguon" style="font-weight:600">Nguồn:</label>
    <select id="nguon" class="nut" style="padding:7px 10px" aria-label="Chọn nguồn dữ liệu">
      <option value="mock" selected>Mock tĩnh (G00)</option>
      <option value="gateway">Gateway local G01 (127.0.0.1:8898)</option>
    </select>
    <input id="khoa-api" type="password" placeholder="X-API-Key (demo-viewer-key / demo-admin-key)" aria-label="Khóa API gateway demo"
      style="padding:7px 11px;border:1px solid var(--vien);border-radius:8px;font-size:13px;width:260px;display:none" value="demo-viewer-key">
    <select id="loc-hang" class="nut" style="padding:7px 10px" aria-label="Lọc theo hãng"><option value="">Tất cả hãng</option></select>
    <select id="loc-tt" class="nut" style="padding:7px 10px" aria-label="Lọc theo trạng thái xử lý">
      <option value="">Mọi trạng thái xử lý</option>
      <option value="thanh_cong">Thành công</option>
      <option value="loi">Lỗi</option>
      <option value="dang_cho">Đang chờ</option>
    </select>
    <input id="loc-ma" type="search" placeholder="Lọc theo mã vận đơn…" aria-label="Lọc theo mã vận đơn"
      style="padding:7px 11px;border:1px solid var(--vien);border-radius:8px;font-size:13px">
    <div class="day"><span class="tag-demo">DEMO — CHƯA KẾT NỐI API</span></div>
  </div>

  <div class="the">
    <div class="the-dau"><h2>Nhật ký sự kiện webhook (mô phỏng)</h2>
      <div class="phai"><span id="dem-sk" style="font-size:12.5px;color:var(--chu-mo)"></span></div></div>
    <div class="cuon-ngang"><table class="bang">
      <thead><tr><th>Mã sự kiện</th><th>Thời gian</th><th>Hãng</th><th>Loại</th><th>Mã vận đơn</th><th>Xử lý</th><th>Lần thử</th><th>Thao tác</th></tr></thead>
      <tbody id="bang-sk"></tbody>
    </table></div>
    <div class="phan-trang" id="pt-sk"></div>
  </div>
</div>
<script src="../assets/js/app.js"></script>
<script src="webhooks.js"></script>
</body>
</html>
